name: SNR Backtest Daily Optimize Report

on:
  workflow_dispatch:
    # 支援在 GitHub 控制台手動點擊「Run workflow」立即執行
  repository_dispatch:
    # 支援外部精準 Cron 服務（如 cron-job.org）在每天早上 7 點整發送 Webhook 觸發
    types: [daily_optimize]

jobs:
  optimize-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run SNR Daily Backtest Optimization
      run: node backtest_optimize_report.js
      env:
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
